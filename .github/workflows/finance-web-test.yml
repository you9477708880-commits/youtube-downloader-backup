name: Finance Web Test

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "finance-web/**"
      - ".github/workflows/finance-web-test.yml"
  push:
    paths:
      - "finance-web/**"
      - ".github/workflows/finance-web-test.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: finance-web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            finance-web/package-lock.json
            finance-web/functions/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install test dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci
        working-directory: finance-web/functions

      - name: Run complete test suite
        run: npm run test:ci

      - name: Upload Emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finance-web-emulator-diagnostics
          path: finance-web/.test-artifacts/emulators
          if-no-files-found: ignore
          retention-days: 14
